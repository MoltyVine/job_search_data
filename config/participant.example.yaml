# Copy to participant.yaml and fill in for each person you process.
# Shared across all data sources (gmail, linkedin, and future sources).
#
#   cp config/participant.example.yaml config/participant.yaml
#
# Set search_window to your inclusive range (required for meaningful runs).

participant:
  name: "Jane Doe"
  first_name: "Jane"
  last_name: "Doe"
  search_window:
    start: "YYYY-MM-DD"   # inclusive — replace with your start
    end: "YYYY-MM-DD"     # inclusive — replace with your end

# One block per data source — add new keys as sources are added.
gmail:
  my_emails:
    - jane.doe@gmail.com

linkedin:
  display_name: "Jane Doe"   # LinkedIn FROM when you send; omit if same as participant.name

# Classification backend for Gmail + LinkedIn (local LLM or Cursor agent).
classification:
  backend: auto          # auto | ollama | cursor
  ollama:
    base_url: "http://127.0.0.1:11434"  # keep local unless you trust a remote host with message text
    model: "qwen2.5:14b"  # or llama3.1:8b

# Future example (not implemented yet):
# sms:
#   phone_numbers: ["+1..."]
